<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScapeRoom - Controle de Acesso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="game-container">

        <!-- Telas serão geradas via JS baseado no Config -->

        <button id="reset-progress-btn" type="button">Reiniciar missão</button>

        <div id="drag-hint-popup" class="hidden" role="status" aria-live="polite">
            Arrasta a chave para o ecrã para iniciar o desafio.
        </div>

        <!-- Container de Chaves -->
        <div id="keys-container"></div>

        <!-- Modal de Senha -->
        <div id="password-modal" class="hidden">
            <div class="modal-content">
                <h2 id="modal-title">Digite a Senha</h2>
                <input type="text" id="password-input" maxlength="10" autocomplete="off">
                <div id="modal-error" style="color:red; height: 20px; margin-bottom: 10px;"></div>
                <button id="modal-submit" class="confirm-btn">CONFIRMAR</button>
                <br>
                <button id="modal-close" class="close-btn">Cancelar</button>
            </div>
        </div>

        <!-- Tela de Vitória -->
        <div id="feedback-screen" class="hidden" aria-label="Mensagem final do jogo"></div>
    </div>

    <script src="../shared/global-session-timer.js"></script>
    <script src="js/config.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
